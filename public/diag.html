<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>onedash — WebAuthn diagnostics</title>
  <!--
    BRING-UP SCAFFOLDING, NOT PART OF THE APP. Registration fails on a real iPhone with the
    PRF extension absent from getClientExtensionResults() entirely, which the app's own
    ceremony can't distinguish from "unsupported" vs "asked for wrongly". This page tests
    PRF on its own so the answer is a fact rather than a guess.

    Delete this file, and the Worker's /debug/client-error route, once the key path is
    confirmed working on real devices (docs/DESIGN.md section 2.2).
  -->
  <style>
    :root { color-scheme: dark light; }
    body {
      margin: 0; padding: 1rem; background: #0b0f0e; color: #e7f3f1;
      font: 14px/1.5 -apple-system, system-ui, sans-serif;
      padding-bottom: max(1rem, env(safe-area-inset-bottom));
    }
    h1 { font-size: 1.1rem; }
    button {
      display: block; width: 100%; margin: 0.5rem 0; padding: 0.75rem 1rem;
      border-radius: 10px; border: none; background: #14b8a6; color: #0b0f0e;
      font-weight: 600; font-size: 0.95rem;
    }
    pre {
      white-space: pre-wrap; word-break: break-all; background: #111a18;
      border: 1px solid #1f2f2c; border-radius: 10px; padding: 0.75rem;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
  </style>
</head>
<body>
  <h1>WebAuthn / PRF diagnostics</h1>
  <p>Capability check runs automatically. The probes each create a throwaway passkey —
     delete any strays in Settings &rsaquo; Passwords afterwards.</p>
  <button id="probe-create">Probe create() with PRF</button>
  <button id="probe-get">Probe get() with PRF</button>
  <pre id="out">running capability check…</pre>

<script>
const out = document.getElementById("out");
const lines = [];

function log(label, value) {
  lines.push(`${label}: ${typeof value === "string" ? value : JSON.stringify(value, replacer, 2)}`);
  out.textContent = lines.join("\n\n");
  report(`DIAG ${label}: ${typeof value === "string" ? value : JSON.stringify(value, replacer)}`);
}

// ArrayBuffers/TypedArrays don't survive JSON.stringify — show their length instead, which
// is the part that matters here (did a PRF output come back, and how big).
function replacer(_key, value) {
  if (value instanceof ArrayBuffer) return `<ArrayBuffer ${value.byteLength} bytes>`;
  if (ArrayBuffer.isView(value)) return `<${value.constructor.name} ${value.byteLength} bytes>`;
  return value;
}

function report(line) {
  try {
    void fetch("/debug/client-error", {
      method: "POST", headers: { "content-type": "text/plain" },
      body: line.slice(0, 900), keepalive: true,
    }).catch(() => {});
  } catch {}
}

const PRF_SALT = new TextEncoder().encode("onedash:prf:master-key").slice(0, 32);

(async function capabilities() {
  lines.length = 0;
  log("userAgent", navigator.userAgent);
  try {
    // The decisive one, and it needs no ceremony: Safari 17.4+ reports which extensions it
    // supports here, so "does this device do PRF at all" is answerable without a prompt.
    const caps = PublicKeyCredential.getClientCapabilities
      ? await PublicKeyCredential.getClientCapabilities()
      : "getClientCapabilities() not implemented";
    log("getClientCapabilities()", caps);
  } catch (e) { log("getClientCapabilities() threw", `${e.name}: ${e.message}`); }

  try {
    log("platformAuthenticatorAvailable",
      await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());
  } catch (e) { log("platformAuthenticatorAvailable threw", `${e.name}: ${e.message}`); }
})();

document.getElementById("probe-create").addEventListener("click", async () => {
  try {
    log("probe-create", "starting…");
    const credential = await navigator.credentials.create({
      publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        rp: { name: "onedash diag", id: location.hostname },
        user: { id: crypto.getRandomValues(new Uint8Array(16)), name: "diag", displayName: "diag" },
        pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
        authenticatorSelection: { residentKey: "required", userVerification: "required" },
        attestation: "none",
        extensions: { prf: { eval: { first: PRF_SALT } } },
      },
    });
    log("create() credential.id", credential.id);
    log("create() extensionResults", credential.getClientExtensionResults());
    sessionStorage.setItem("diagCredId", credential.id);
  } catch (e) { log("create() threw", `${e.name}: ${e.message}`); }
});

document.getElementById("probe-get").addEventListener("click", async () => {
  try {
    log("probe-get", "starting…");
    const assertion = await navigator.credentials.get({
      publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        userVerification: "required",
        extensions: { prf: { eval: { first: PRF_SALT } } },
      },
    });
    log("get() credential.id", assertion.id);
    log("get() extensionResults", assertion.getClientExtensionResults());
  } catch (e) { log("get() threw", `${e.name}: ${e.message}`); }
});
</script>
</body>
</html>
