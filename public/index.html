<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>onedash — personal dashboard</title>
  <link rel="canonical" href="https://oneda.sh/" />
  <!-- Enough for a crawler or a filtering service to file this correctly rather
       than as an unknown domain, which is what gets a site blocked by default.
       It describes what the site is and nothing about how it works: no routes,
       no protocol, no schema (section 13.3). -->
  <meta name="description" content="onedash is a private, end-to-end encrypted personal dashboard — notes, tasks, reminders and calendar in one place, readable only on its owner's own devices." />
  <meta name="robots" content="index, follow" />
  <meta name="application-name" content="onedash" />
  <meta name="apple-mobile-web-app-title" content="onedash" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="color-scheme" content="dark" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="onedash" />
  <meta property="og:title" content="onedash — personal dashboard" />
  <meta property="og:description" content="A private, end-to-end encrypted personal dashboard. Sign in with a passkey." />
  <meta property="og:url" content="https://oneda.sh/" />
  <meta property="og:image" content="https://oneda.sh/icons/icon-512.png" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="onedash — personal dashboard" />
  <meta name="twitter:description" content="A private, end-to-end encrypted personal dashboard. Sign in with a passkey." />
  <meta name="twitter:image" content="https://oneda.sh/icons/icon-512.png" />

  <link rel="manifest" href="/shell/manifest.json" />
  <meta name="theme-color" content="#161826" />
  <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  <!-- Self-hosted, same origin — the client never makes an offsite request,
       here or anywhere else. Preloaded because the lock screen is the first
       paint and there is no stylesheet to discover the face from. -->
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
  <style id="lock-css">
    @font-face {
      font-family: "Inter";
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url("/fonts/inter-latin.woff2") format("woff2");
    }
    :root { color-scheme: dark light; }
    /* One fixed screen, never a scrollable document. On iOS `100vh` is the *large*
       viewport — it counts the space behind Safari's toolbars — so the body ends up taller
       than what's actually visible, which both offsets the centring and leaves the page
       scrollable. `100dvh` is the live value, with vh kept underneath as the fallback for
       anything that doesn't know it. overscroll-behavior kills the rubber-band too. */
    html, body { overflow: hidden; overscroll-behavior: none; }
    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      background: #161826; color: #e9e9ed;
      font: 16px/1.4 "Inter", -apple-system, system-ui, sans-serif;
    }
    /* viewport-fit=cover puts the page under the notch and home indicator, so keep the
       content clear of both even though it's centred. */
    .lock {
      text-align: center;
      padding: 2rem;
      padding-top: max(2rem, env(safe-area-inset-top));
      padding-bottom: max(2rem, env(safe-area-inset-bottom));
    }
    /* A fingerprint, because what this screen asks for is a fingerprint — the
       brand mark said nothing about what to do here. Stroked rather than filled
       so it reads at this size and inherits its colour. */
    .print {
      display: block; width: 60px; height: 60px; margin: 0 auto 1.5rem;
      fill: none; stroke: #9184d9; stroke-width: 1.7;
      stroke-linecap: round; stroke-linejoin: round;
    }
    h1 { font-size: 1.35rem; font-weight: 600; margin: 0 0 0.4rem; }
    button {
      margin-top: 1.5rem; padding: 0.75rem 1.5rem; border-radius: 999px; border: none;
      background: #9184d9; color: #161826; font-weight: 600; font-size: 1rem;
    }
    p.status { opacity: 0.7; min-height: 1.4em; }
    .setup-link {
      display: block; margin-top: 1rem; background: none; border: none; color: #9184d9;
      font-size: 0.85rem; padding: 0.25rem; text-decoration: underline;
    }
    /* Same gotcha .overlay[hidden] below already works around: this rule's own `display:
       block` beats the UA stylesheet's `[hidden] { display: none }` at equal specificity, so
       setupBtn.hidden = true (auth.ts, once an account already exists) would do nothing
       without this. */
    .setup-link[hidden] {
      display: none;
    }
    /* The recovery phrase display/confirm and the "recover with a phrase" redemption form —
       both full-screen takeovers over the lock screen, built by auth.ts. Kept in this
       stylesheet rather than injected by JS so it survives the same build-time minification
       (scripts/build-app.mjs) as everything else here. */
    .overlay {
      position: fixed; inset: 0; z-index: 10; background: #161826;
      display: flex; align-items: flex-start; justify-content: center;
      overflow-y: auto; padding: max(2rem, env(safe-area-inset-top)) 1.25rem 2rem;
    }
    .overlay[hidden] { display: none; }
    .overlay-inner { max-width: 420px; width: 100%; margin: auto 0; }
    .overlay h2 { font-size: 1.15rem; margin: 0 0 0.5rem; text-align: center; }
    .overlay p.sub { opacity: 0.7; font-size: 0.9rem; text-align: center; margin: 0 0 1.25rem; line-height: 1.5; }
    .phrase-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-bottom: 1.5rem;
    }
    .phrase-grid .w {
      background: #1f2233; border-radius: 8px; padding: 0.5rem 0.6rem;
      font-size: 0.9rem; display: flex; gap: 0.4rem; align-items: baseline;
    }
    .phrase-grid .w b { opacity: 0.45; font-weight: 400; min-width: 1.2em; }
    .confirm-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.75rem; }
    .confirm-row label { flex: none; width: 4.5rem; opacity: 0.7; font-size: 0.9rem; }
    input.word-input, textarea.phrase-input {
      flex: 1; background: #1f2233; border: 1px solid #2c3049; border-radius: 8px;
      color: #e9e9ed; padding: 0.55rem 0.7rem; font: inherit; font-size: 16px;
    }
    textarea.phrase-input { width: 100%; min-height: 4.5rem; resize: vertical; margin-bottom: 1rem; }
    .overlay button { width: 100%; display: block; margin-top: 0.75rem; }
    .overlay button.ghost {
      background: none; border: 1px solid #2c3049; color: #c9c9d8;
    }
    .err { color: #e2777f; font-size: 0.85rem; margin: 0.6rem 0 0; min-height: 1.2em; text-align: center; }
  </style>
</head>
<body>
  <!--
    This is the ENTIRE pre-auth surface (section 13.1). No tile registry, no sync/crypto
    logic beyond the WebAuthn challenge below. Tile bundles live under /app/ and are
    session-gated server-side (section 13.2) — do not add app logic to this file.
  -->
  <div class="lock">
    <svg class="print" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M18.9 7a8 8 0 0 1 1.1 5v1a6 6 0 0 0 .8 3" />
      <path d="M8 11a4 4 0 0 1 8 0v1a10 10 0 0 0 2 6" />
      <path d="M12 11v2a14 14 0 0 0 2.5 8" />
      <path d="M8 15a18 18 0 0 0 1.8 6" />
      <path d="M4.9 19a22 22 0 0 1 -.9 -7v-1a8 8 0 0 1 12 -6.95" />
    </svg>
    <h1>onedash</h1>
    <p class="status" id="status">Unlock with your passkey</p>
    <button id="unlock">Unlock</button>
    <!-- Bootstrap-only (section 2.1): the Worker only accepts /auth/register/* until the
         first account exists, so this is only ever useful once, on a fresh deployment. -->
    <button class="setup-link" id="setup" type="button">First time? Set up your passkey</button>
    <button class="setup-link" id="recover" type="button">Lost your passkey? Recover with your phrase</button>
    <!-- The escape hatch for when this screen itself is the problem — a stale session
         cookie, a broken local cache — and Settings' own "Reset this device" can't be
         reached because reaching it means getting past this screen first. -->
    <button class="setup-link" id="wipe" type="button">Sign out and clear this device</button>
  </div>
  <!-- Populated entirely by auth.ts: the recovery phrase display/confirm at registration,
       and the phrase-entry redemption form. Nothing here is static markup. -->
  <div class="overlay" id="overlay" hidden></div>
  <!-- Says the same thing in the form the categorisers actually parse. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "onedash",
    "url": "https://oneda.sh/",
    "applicationCategory": "ProductivityApplication",
    "operatingSystem": "Any",
    "browserRequirements": "Requires a browser with WebAuthn passkey support",
    "description": "A private, end-to-end encrypted personal dashboard for one person's notes, tasks, reminders and calendar.",
    "isAccessibleForFree": true,
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "GBP" }
  }
  </script>
  <script type="module" src="/shell/auth.js"></script>
</body>
</html>
