name = "onedash"
main = "src/worker/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# routes = [{ pattern = "oneda.sh", custom_domain = true }]

# Public pre-auth shell only (section 13.1) — index.html/auth.js/manifest/sw/icons.
# Everything under /app/ (tile bundles) is deliberately NOT served from here; it goes
# through the Worker's session-gated route instead (section 13.2), so it must be built to
# a separate output directory and served from src/worker/index.ts, not this binding.
[assets]
directory = "./public"
binding = "SHELL_ASSETS"

# dist/app/*.txt is the built gated bundle (`npm run build:app`, section 4.4/13.2) — a JS
# module and a stylesheet, both bundled as plain text so index.ts can stream them back to an
# authenticated caller without ever executing them inside the Worker. No `[[rules]]` entry
# needed: Wrangler already treats `**/*.txt` as a Text-module import by default.

[[durable_objects.bindings]]
name = "USER_SESSION"
class_name = "UserSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserSession"]

[[d1_databases]]
binding = "DB"
database_name = "onedash_db"
database_id = "3d46a540-1264-426d-a613-5294f46d367a"
# Created in WEUR — the whole system is UK-only by design (section 1), so there's no reason
# to let the primary land anywhere else. A database id is a resource identifier, not a
# credential: it's useless without an API token, hence committed rather than a secret.

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "onedash-blobs"
# Also created with a WEUR location hint, to match the D1 primary above.

# One Cron Trigger drives both reminder alarms fallback and RSS polling (section 6.1, 9a).
[triggers]
crons = ["*/15 * * * *"]

[vars]
ENVIRONMENT = "development"

# Secrets (set via `wrangler secret put`, never committed):
#   WEBAUTHN_RP_ID, WEBAUTHN_ORIGIN
#   VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY
#   MONZO_CLIENT_ID, MONZO_CLIENT_SECRET
#   YOUTUBE_CLIENT_ID / SPOTIFY / BMW / RING credentials, as each integration tile is built
